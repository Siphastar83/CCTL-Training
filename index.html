<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <meta name="description" content="CCTL Trainer — transforme tes PDF de CCTL en QCM interactifs.">
  <title>CCTL Trainer — Révise intelligemment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="CCTL Trainer accueil">
        <span class="brand-mark">C</span><span>CCTL<span class="brand-light">TRAINER</span></span>
      </a>
      <div class="side-label">ESPACE DE RÉVISION</div>
      <nav class="nav">
        <button class="nav-link active" data-view="home"><span class="nav-icon">⌂</span>Vue d'ensemble</button>
        <button class="nav-link" data-view="practice"><span class="nav-icon">✳</span>Entraînement</button>
        <button class="nav-link" data-view="topics"><span class="nav-icon">▤</span>Par matière</button>
        <button class="nav-link" data-view="stats"><span class="nav-icon">↗</span>Ma progression</button>
        <button class="nav-link" data-view="library"><span class="nav-icon">⇪</span>Mes CCTL (PDF)</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="mini-card">
          <div class="mini-orb">✦</div>
          <strong>Un peu chaque jour.</strong>
          <p>La régularité fait la différence.</p>
        </div>
        <div class="side-foot">Version 2.0 · Questions générées depuis tes PDF</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="menuBtn" aria-label="Ouvrir le menu">☰</button>
        <div class="breadcrumb">ESPACE PERSONNEL <span>/</span> <b id="crumb">Vue d'ensemble</b></div>
        <div class="top-actions">
          <span class="status-dot"></span><span class="status-text">Chargement…</span>
          <button class="avatar" title="Profil local">A</button>
        </div>
      </header>
      <div class="content" id="appContent"><div class="empty-state">Chargement…</div></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
  <noscript><p style="padding:20px">CCTL Trainer a besoin de JavaScript.</p></noscript>
</body>
</html>
